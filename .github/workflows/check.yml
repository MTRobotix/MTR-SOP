# Blocks any change to main that breaks the SOP rules, whichever editor made it.
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Content-only changes skip typecheck and lint: they cannot break the code.
      - id: changes
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git fetch -q --depth=1 origin "$base" || true
          if git diff --quiet "$base" HEAD -- . ':(exclude)content'; then echo code=false >> "$GITHUB_OUTPUT"; else echo code=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run content:check
      - run: npm run typecheck
        if: steps.changes.outputs.code == 'true'
      - run: npm run lint
        if: steps.changes.outputs.code == 'true'
